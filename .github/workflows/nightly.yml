name: Nightly pull list

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mock:
        description: "Use made-up numbers (no eBay keys needed)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build pull list
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          PULLLIST_MOCK: ${{ inputs.mock }}
        run: python pulllist.py
      - name: Publish
        run: |
          git config user.name "pulllist-bot"
          git config user.email "pulllist-bot@users.noreply.github.com"
          git add docs/index.html logs/api_log.txt
          git commit -m "Pull list $(date -u +%F)" || echo "No changes"
          git push
